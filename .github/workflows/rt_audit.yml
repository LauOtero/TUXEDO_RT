name: TUXEDO_RT Audit & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Requerimientos adicionales para tests
        pip install cffi pyserial python-can msgspec

    - name: Build C Helper (chelper)
      run: |
        cd klippy/chelper
        python3 __init__.py
      env:
        CC: gcc

    - name: Run RT Core Unit Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/klippy
        python3 tests/test_rtcore.py
        python3 tests/test_rtcore_determinism.py

    - name: Run Connection Architecture Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/klippy
        python3 tests/test_plugin_manager.py
        python3 tests/test_mcu_transport_scenarios.py

    - name: Run Performance Benchmarks (Integrity check)
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/klippy
        python3 tests/benchmark_rtcore.py
        python3 tests/benchmark_clocksync.py
        python3 tests/benchmark_gcode.py

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
