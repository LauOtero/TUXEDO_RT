# Configuración del componente UPS NUT para Moonraker
# Añadir esta sección al archivo moonraker.conf

[ups_nut]
# Dirección IP o hostname del servidor NUT (upsd)
host: 127.0.0.1

# Puerto TCP del servidor NUT (por defecto 3493)
port: 3493

# Credenciales de autenticación NUT
# Deben coincidir con las definidas en /etc/nut/upsd.users
username: monuser
password: secret

# Nombre de la UPS configurado en /etc/nut/ups.conf
ups_name: ups

# Intervalo de sondeo en segundos (mínimo 1 segundo)
poll_interval: 5.0

# Habilitar/deshabilitar el componente
enabled: True

# Umbrales de batería (porcentajes)
# low_battery_threshold: 20
# critical_battery_threshold: 10
