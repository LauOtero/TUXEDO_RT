# Configuracion de Ejemplo para Cinematica de 5 Ejes (XYZ + AB) con TCP
# =============================================================================
#
# Este archivo muestra la configuracion necesaria para usar la cinematica
# nativa de 5 ejes con TCP (Tool Center Point Control) en Klipper.
#
# COLOCAR EN: ~/printer_data/config/printer_5axis.cfg
# INCLUIR EN: printer.cfg principal con [include printer_5axis.cfg]
#
# ----------------------------------------------------------------------
# SECCION PRINCIPAL DEL IMPRESOR
# ----------------------------------------------------------------------
[printer]
kinematics: five_axis
max_velocity: 300
max_accel: 3000

# Parametros TCP (Tool Center Point Control)
# ============================================
# pivot_offset_z: Distancia desde el centro de rotacion (pivote) hasta la
#                 punta de la boquilla. Positivo hacia -Z (abajo).
#                 Valor tipico: 30-80mm dependiendo de la configuracion del spindle
pivot_offset_z: 50.0

# tool_offset_x/y/z: Compensacion adicional del tool (boquilla) respecto
#                    al centro del spindle. Tipicamente 0 para un spindle
#                    centrado, o valores pequenos para offsets mecanicos.
tool_offset_x: 0.0
tool_offset_y: 0.0
tool_offset_z: 0.0

# Longitudes de brazos (para calculos cinematicos internos)
# =========================================================
# Estos valores se usan para validacion y calculos de limites.
# Ajustar segun el diseno mecanico de la maquina.
arm_length_a: 100.0
arm_length_b: 100.0

# Limite de velocidad para movimientos en Z (normalmente menor que XY)
# ===================================================================
max_z_velocity: 50

# ----------------------------------------------------------------------
# STEPPER X (Eje lineal - Axis 0)
# ----------------------------------------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
position_endstop: 0
position_max: 200

# ----------------------------------------------------------------------
# STEPPER Y (Eje lineal - Axis 1)
# ----------------------------------------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
position_endstop: 0
position_max: 200

# ----------------------------------------------------------------------
# STEPPER Z (Eje lineal - Axis 2)
# ----------------------------------------------------------------------
[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PG5
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 8
position_endstop: 0
position_max: 100

# ----------------------------------------------------------------------
# STEPPER A (Eje rotacional - Axis 3)
# ----------------------------------------------------------------------
# Este es el eje de rotacion primario (generalmente rotacion alrededor de X)
# IMPORTANTE: units_in_radians = False para usar GRADOS (configuracion elegida)
#
# NOTA: La funcionalidad de homing para ejes rotacionales es limitada;
# se recomienda marcar como referenciado manualmente despues del encendido.
[stepper_a]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PC15
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 360
position_endstop: 0
position_min: -360
position_max: 360
units_in_radians: False

# ----------------------------------------------------------------------
# STEPPER B (Eje rotacional - Axis 4)
# ----------------------------------------------------------------------
# Este es el eje de rotacion secundario (generalmente rotacion alrededor de Y)
# NOTA: Este eje compensa automaticamente via TCP cuando A rota.
[stepper_b]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE4
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 360
position_endstop: 0
position_min: -360
position_max: 360
units_in_radians: False

# ----------------------------------------------------------------------
# CONFIGURACION DE HOMING
# ----------------------------------------------------------------------
[homing_override]
axes: xyz
set_position_z: 0

# ----------------------------------------------------------------------
# SENSORES DE FINAL DE CARRERA (Endstops)
# ----------------------------------------------------------------------
[endstop_filter]
pin: !PG6

# Endstops para X, Y, Z
[probe]
pin: ^PG6

# ----------------------------------------------------------------------
# TEMPERATURA (Hotend y Cama)
# ----------------------------------------------------------------------
[extruder]
step_pin: PF9
dir_pin: !PF6
enable_pin: !PF8
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.603
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 4
max_extrude_only_distance: 100
max_extrude_only_velocity: 50
max_extrude_only_accel: 500
heater_pin: PC13
sensor_type: NTC 100K beta 3950
sensor_pin: PC5

[heater_bed]
heater_pin: PE5
sensor_type: NTC 100K beta 3950
sensor_pin: PC4

# ----------------------------------------------------------------------
# CONFIGURACION DE VENTILADOR
# ----------------------------------------------------------------------
[fan]
pin: PA8
kick_start_time: 0.500

# ----------------------------------------------------------------------
# VARIABLES GUARDADAS (para persistencia de estado)
# ----------------------------------------------------------------------
[saved_variables]
# Aqui se guardan los offsets TCP y otras variables persistentes
# tcp_pivot_offset_z: 50.0
# tcp_tool_offset_x: 0.0
# tcp_tool_offset_y: 0.0
# tcp_tool_offset_z: 0.0

# ----------------------------------------------------------------------
# NOTAS SOBRE LA CINEMATICA TCP
# ----------------------------------------------------------------------
#
# Cuando se usa TCP (Tool Center Point Control):
# 1. Los ejes A y B rotan para orientar la herramienta
# 2. Los ejes X, Y, Z se compensan automaticamente para mantener la
#    punta de la boquilla en la misma posicion respecto a la pieza
# 3. Esto permite movimientos de rotacion sin que la boquilla se desplace
#
# COMPENSACION TCP:
#   TCP_x = X - pivot * sin(A) * cos(B) - tool_offset_x
#   TCP_y = Y - pivot * sin(A) * sin(B) - tool_offset_y
#   TCP_z = Z - pivot * (1 - cos(A))      - tool_offset_z
#
# CONFIGURACION DE GRADOS (unidades_in_radians: False):
#   - Los ejes A y B usan GRADOS en la configuracion
#   - Se convierten a radianes internamente para calculos trigonometricos
#   - El parametro pivot_offset_z es POSITIVO hacia -Z (abajo)
#
# LIMITACIONES ACTUALES:
#   - El homing de ejes rotacionales (A, B) debe hacerse manualmente
#   - Se recomienda marcar los ejes A/B como "homed" inicialmente
#   - Los movimientos deben planificarse cuidadosamente para evitar
#     colisiones entre el spindle y la pieza
