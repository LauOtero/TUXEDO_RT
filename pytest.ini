[pytest]
# ==============================================================================
# Configuración de pytest para TUXEDO_RT
# ==============================================================================
# Cobertura mínima requerida: 90%
# ==============================================================================

[tool:pytest]
# Directorios de tests
testpaths = tests

# Archivos de tests
python_files = test_*.py

# Directorios a ignorar en coverage
omit =
    */backup/*
    */temp/*
    */mock_configs/*
    */__pycache__/*
    */.git/*
    */docs/*

# Opciones de coverage
addopts =
    --strict-markers
    --tb=short
    --strict-cli
    -ra

# Marcadores personalizados
markers =
    unit: Tests unitarios
    integration: Tests de integración
    stress: Tests de carga/estrés
    slow: Tests que toman más de 10 segundos
    benchmark: Benchmarks de rendimiento
    requires_chelper: Tests que requieren chelper compilado
    requires_linux: Tests que solo funcionan en Linux/WSL

# Tiempo máximo por test (en segundos)
timeout = 300

# Salida de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuración de coverage
[coverage:run]
branch = True
concurrency = multiprocessing
parallel = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = coverage_html

[coverage:json]
output = coverage.json